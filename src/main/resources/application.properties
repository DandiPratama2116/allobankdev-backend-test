# Server configuration (as required by Dockerfile port 4110)
server.port=4110

# Application configuration
spring.application.name=split-bill-api

# Personalization configuration
# GitHub username used to dynamically compute service_charge_pct and service_charge_amount
app.personalization.github-username=dandipratama2116

# H2 Database configuration
spring.datasource.url=jdbc:h2:mem:splitbilldb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true
